name: Windows package

# MANUAL TRIGGER ONLY.
#
# Packaging is not run on every push: a release build is a deliberate act, it
# is slow, and the artifact is large (the installers embed the WebView2 offline
# runtime so that installing needs no internet access). This workflow runs only
# when a person starts it, and it records who did.
#
# The artifact supports Windows 10 (1709+, including LTSC) and Windows 11, x64.
#
# Signing is opt-in per run and reads secrets BY NAME ONLY (SEC-4).
# No key material appears in this file, and none may be committed:
# the private key lives solely in repository secrets.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the updater artifacts (requires signing secrets to be configured)"
        type: boolean
        default: false
      publishRelease:
        description: "Publish the generated installers as GitHub Release assets"
        type: boolean
        default: false
      releaseTag:
        description: "Existing tag that points to this exact commit (required when publishing)"
        type: string
        required: false
        default: ""
      apiBaseUrl:
        description: "API origin to build against. Leave blank for the production default (https://www.tenders-sa.org). Any value here must already appear in src-tauri/capabilities/default.json, or the plugin will deny every request at runtime."
        type: string
        required: false
        default: ""

permissions:
  # The release step only runs when publishRelease is explicitly selected.
  # It needs this scope to create/update the requested GitHub Release and
  # attach the installers that this job just built.
  contents: write

jobs:
  package:
    name: Build and package (Windows)
    runs-on: windows-latest
    steps:
      - name: Record who requested this run
        shell: bash
        run: echo "Packaging requested by @${{ github.actor }} for ${{ github.ref }}"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and bundle
        run: pnpm run tauri build
        env:
          # Left blank on a normal run: the application defaults to the live
          # platform, so an artifact built with no configuration is a working
          # production build rather than a broken one.
          VITE_API_BASE_URL: ${{ inputs.apiBaseUrl }}
          # Referenced by secret name only. When `sign` is false these
          # resolve to empty and Tauri produces unsigned artifacts,
          # which is the correct default for a test package.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      - name: Verify release tag
        if: inputs.publishRelease
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.releaseTag }}
        run: |
          test -n "$RELEASE_TAG" || { echo "releaseTag is required when publishRelease is true"; exit 1; }
          git fetch --tags --force
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA" || {
            echo "Release tag $RELEASE_TAG must point to the packaged commit $GITHUB_SHA"
            exit 1
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tenders-sa-desktop-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish GitHub Release
        if: inputs.publishRelease
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.releaseTag }}
          name: Tenders-SA Desktop ${{ inputs.releaseTag }}
          body: |
            Download the Windows x64 NSIS installer (`*-setup.exe`) or MSI (`*.msi`).
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
