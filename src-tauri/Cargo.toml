[package]
name = "tenders-sa-desktop"
version = "0.1.0"
description = "Tenders-SA Desktop procurement workspace"
authors = ["Tenders-SA"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tenders_sa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
keyring = "4"
aes-gcm = "0.10"
base64 = "0.22"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# HTTP transport (TASK-2.2). `dangerous-settings` and `unsafe-headers` are
# deliberately NOT enabled -- see SPEC_CONTRACT KEY CONSTRAINTS.
#
# `rustls-tls` is mandatory, not optional: the application origin is hard-wired
# to https://www.tenders-sa.org, and without a TLS backend reqwest fails every
# https request at the transport layer. Phase 2 only ever pointed at a plain
# http localhost backend, which is why the missing TLS went undetected until
# production pointing. `http2` and `charset` mirror the plugin's own defaults
# for the API's transport. `cookies` and `macos-system-configuration` are
# deliberately omitted: the desktop authenticates with bearer headers, never
# cookies, and the product ships Windows-only.
#
# capability-scope.test.ts pins this: TLS must stay enabled or every request
# to the production API fails again with "Could not reach Tenders-SA".
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset"] }
# Export save path (Slice 6: desktop-workspace-export-response-package R-Ex-3).
# Least privilege: only `dialog:allow-save` and `fs:allow-write-file` are
# granted in capabilities/default.json; the dialog plugin extends the fs scope
# at runtime to exactly the user-picked path, so no static fs scope is granted.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

