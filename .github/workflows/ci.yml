name: CI

# Non-build verification only. A Windows release build is deliberately
# NOT here: AGENTS.md and SPEC_CONTRACT.md make packaging a human- or
# approved-CI gate, so it lives in windows-package.yml behind a manual
# trigger. See docs/development.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Types
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux backend needs these to compile at all. The
      # shipped product targets Windows only (WebView2); this is purely
      # so `cargo check` can run on a Linux runner.
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
